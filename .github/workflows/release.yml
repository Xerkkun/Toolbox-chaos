name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt

      - name: Prepare runtime resources
        run: python scripts/prepare_runtime_resources.py

      - name: Verify packaging policy
        run: python scripts/verify_packaging.py

      - name: Run package metadata tests
        run: python -m pytest tests/test_packaging_metadata.py -q

      - name: Build with PyInstaller (macOS/Linux)
        if: matrix.os != 'windows-latest'
        run: python -m PyInstaller --noconfirm packaging/pyinstaller/chaos_toolbox.spec

      - name: Build Windows Executable & Installer
        if: matrix.os == 'windows-latest'
        run: .\scripts\build_windows.ps1

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: chaos-toolbox-${{ matrix.os }}
          path: |
            dist/
            installer/*.exe

  notes:
    name: Signing and publishing notes
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Windows signing placeholder: configure certificate secrets before signing."
          echo "macOS signing/notarization placeholder: configure Apple Developer credentials."
          echo "Linux package signing placeholder: configure distro-specific keys."
