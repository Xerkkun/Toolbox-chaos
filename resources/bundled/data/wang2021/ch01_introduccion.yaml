- system_id: lorenz
  name: Lorenz system
  aliases: []
  source:
    book: "Wang, Kuznetsov & Chen (eds.), 2021"
    chapter_number: 1
    chapter_title: "Introduction"
    pages: [3]
  primary_reference:
    authors: "Edward N. Lorenz"
    year: 1963
    title: "Deterministic nonperiodic flow"
    venue: "Journal of the Atmospheric Sciences"
    doi: "10.1175/1520-0469(1963)020<0130:DNF>2.0.CO;2"
  model:
    model_type: ode
    dimension: 3
    state_variables: [x, y, z]
    parameters:
      sigma: 10.0
      rho: 28.0
      beta: 2.6666666666666665
    equations_latex: |
      \dot{x}=\sigma(y-x)
      \dot{y}=\rho x-y-xz
      \dot{z}=-bz+xy
  reported_dynamics:
    attractor_type: self_excited
    lyapunov_exponents: [0.9056, 0.0, -14.5723]
    kaplan_yorke_dimension: 2.06
  initial_conditions:
    reported: []
    recommended_for_reproduction: [0.1, 0.1, 0.1]
  equilibria:
    reported:
      - name: O
        point: [0, 0, 0]
      - name: E+
        point: [8.48528137, 8.48528137, 27]
      - name: E-
        point: [-8.48528137, -8.48528137, 27]
  implementation:
    file: "core/lorenz.py"
    preset_file: "core/lorenz.py"
    test_file: "tests/test_wang2021_ch01.py"
    simulation_status: implemented
  validation:
    equation_verified_against_pdf: true
    equilibria_verified: true
    smoke_simulation_passed: true

